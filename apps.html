<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syntropica - Cybersecurity Excellence</title>
    <link rel="icon" href="https://assets.r2.csec.top/logo/white.blank.svg" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            line-height: 1.6;
        }
        #logocont {
            display: flex;
        }
        .navbar {
            position: sticky;
            top: 0;
            width: 100%;
            background-color: rgba(15, 15, 15, 0.95);
            padding: 1rem 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .nav-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            height: 50px;
            width: auto;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: #00ff00;
        }

        .apps-section {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 2rem;
        }

        .apps-list {
            display: flex;
            flex-wrap: wrap;
            gap: 2rem;
            list-style: none;
            padding: 0;
            margin: 0;
            justify-content: flex-start;
        }

        .app-card {
            background-color: #161616;
            border-radius: 12px;
            padding: 1.8rem 1.5rem;
            flex: 1 1 280px;        /* 弹性宽度，最小约280px */
            max-width: 360px;       /* 防止过宽，更整齐 */
            display: flex;
            flex-direction: column;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.6);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #2a2a2a;
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 24px rgba(0, 255, 0, 0.1);
            border-color: #2f2;
        }

        .app-name {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.3;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .app-desc {
            color: #b0b0b0;
            font-size: 1rem;
            margin-bottom: 1.5rem;
            flex-grow: 1;          /* 让按钮始终靠下 */
        }

        .app-link {
            background: #2F2;
            color: #000;
            padding: 12px 22px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.05rem;
            text-align: center;
            display: inline-block;
            align-self: flex-start;  /* 按钮不拉伸 */
            transition: all 0.25s ease;
            border: 1px solid transparent;
            margin-top: 0.5rem;
            min-width: 100px;
        }

        .app-link:hover {
            background: #1D1;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 255, 0, 0.25);
        }

        @media (max-width: 700px) {
            .apps-list {
                gap: 1.5rem;
            }
            .app-card {
                flex: 1 1 100%;
                max-width: 100%;
            }
            .app-name {
                font-size: 1.6rem;
            }
        }
    </style>
  </head>
  <body>
    <nav class="navbar">
        <div class="nav-content">
            <div id="logocont">
                <img href="https://csec.top/" src="https://assets.r2.csec.top/logo/white.blank.svg" alt="CSEC Logo" class="logo">
                <h1>Syntropica 负熵之陆</h1>
            </div>
            <div class="nav-links">
                <a href="https://csec.top/">Home</a>
                <a href="mailto:admin@csec.top">Contact</a>
                <!-- <a href="status">Status</a> -->
                <a href="https://github.com/orgs/C-S-E-C/repositories">Repositories</a>
                <a href="https://csec.top/apps.html">Apps</a>
                <a href="https://ifdian.net/a/__CSEC__">Donate</a>
            </div>
        </div>
    </nav>
    <br />
    <section class="apps-section">
        <ul class="apps-list">
            <li class="app-card">
                <h2 class="app-name">Cloudrive</h2>
                <p class="app-desc">A simple cloud-storage app</p>
                <a href="https://cloudrive.csec.top/" class="app-link" target="_blank" rel="noopener">View</a>
            </li>
            <li class="app-card">
                <h2 class="app-name">New Year Countdown</h2>
                <p class="app-desc">A New Year Countdown Clock</p>
                <a href="https://syntropica.top/newyearcountdown" class="app-link" target="_blank" rel="noopener">View</a>
            </li>
        </ul>
    </section>

  </body>
</html>
